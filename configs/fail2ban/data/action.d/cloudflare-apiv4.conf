[Definition]
actionstart = python3 /data/scripts/cloudflare_firewall.py check
actionflush = true
actionstop =
actioncheck =
actionban = [ "<restored>" = "1" ] || python3 /data/scripts/cloudflare_firewall.py ban <ip>
actionunban = python3 /data/scripts/cloudflare_firewall.py unban <ip>
# Cloudflare rules persist across local restarts; do not replay API writes.

timeout = 120
