# challenges, missing pages, API errors, or asset failures.
attack = /(?:[^/" ?]+/)*(?:\.env(?:\.[^" ?/]+)?|\.git/(?:config|HEAD|index)|etc/passwd|vendor/phpunit/[^" ?]+/eval-stdin\.php|actuator/(?:env|heapdump|configprops)|cgi-bin/[^" ?]*(?:\.\.|/bin/(?:sh|bash))[^" ?]*)(?:\?[^" ]*)?
failregex = ^<HOST> - \S+ \[[^]]*\] "\S+ (?i:%(attack)s) HTTP/\d(?:\.\d)?" 4\d\d \d+ "[^"]*" "[^"]*"\s*$
            ^\[[^]]*\] \S+ (?:\d{3}(?:, \d{3})*|-) 4\d\d - \S+ https? \S+ "(?i:%(attack)s)" \[Client <HOST>\] \[Length \d+\] .*$
            ^\[[^]]*\] 4\d\d - \S+ https? \S+ "(?i:%(attack)s)" \[Client <HOST>\] \[Length \d+\] .*$
