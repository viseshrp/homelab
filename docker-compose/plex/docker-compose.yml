services:
  plex:
    image: "${PLEX_IMAGE:-lscr.io/linuxserver/plex:latest}"
    container_name: plex
    devices:
    - "/dev/dri:/dev/dri"
    volumes:
    - "./config:/config"
    - "${MEDIA2_ROOT:-/mnt/media2}:/mnt/media:ro"
    - "${MEDIA3_ROOT:-/mnt/media3}:/mnt/media3:ro"
    network_mode: host
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    environment:
      PUID: '0'
      PGID: '0'
      VERSION: docker
      TZ: "${TZ:-America/New_York}"
