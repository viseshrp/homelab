services:
  ntfy:
    image: "${NTFY_IMAGE:?Set NTFY_IMAGE to a pinned ntfy image}"
    container_name: ntfy
    command:
      - serve
    environment:
      TZ: "${TZ:?Set TZ}"
      NTFY_BASE_URL: "${NTFY_BASE_URL:?Set the public HTTPS base URL}"
      NTFY_LISTEN_HTTP: ":8080"
      NTFY_CACHE_FILE: "/var/lib/ntfy/cache.db"
      NTFY_CACHE_DURATION: "${NTFY_CACHE_DURATION:-72h}"
      NTFY_AUTH_FILE: "/var/lib/ntfy/user.db"
      NTFY_AUTH_DEFAULT_ACCESS: "deny-all"
      NTFY_AUTH_USERS: "${NTFY_AUTH_USERS:?Set declarative ntfy users}"
      NTFY_AUTH_ACCESS: "${NTFY_AUTH_ACCESS:?Set declarative ntfy ACLs}"
      NTFY_AUTH_TOKENS: "${NTFY_AUTH_TOKENS:?Set declarative ntfy tokens}"
      NTFY_BEHIND_PROXY: "true"
      NTFY_ENABLE_LOGIN: "true"
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_UPSTREAM_BASE_URL: "${NTFY_UPSTREAM_BASE_URL:-https://ntfy.sh}"
    user: "${NTFY_UID:-1000}:${NTFY_GID:-1000}"
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${NTFY_BIND_IP:?Set the private LAN bind address}:${NTFY_HTTP_PORT:-2586}:8080"
    volumes:
      - ./data:/var/lib/ntfy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q --tries=1 http://127.0.0.1:8080/v1/health -O - |
          grep -Eo '"healthy"\s*:\s*true' >/dev/null || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    restart: unless-stopped
