# The live host keeps its private environment in the existing Compose file.
# This override lets an in-place deployment add the compatibility image and
# healthcheck without rewriting that private configuration.
services:
  homarr:
    build:
      context: .
      args:
        HOMARR_BASE_IMAGE: "${HOMARR_BASE_IMAGE:-ghcr.io/ajnart/homarr@sha256:e103abadfb527186af5b4bd43df4eff7c67afa5cd4df8e65fa97910c8840b2a9}"
    image: "${HOMARR_IMAGE:-homelab/homarr:0.16.1-qbittorrent-5.2}"
    extra_hosts:
    - "optiplex:${OPTIPLEX_IP:-192.168.68.132}"
    - "rpihass:${RPIHASS_IP:-192.168.68.103}"
    - "rpimon:${RPIMON_IP:-192.168.68.124}"
    healthcheck:
      test:
      - CMD-SHELL
      - "wget --no-verbose --tries=1 --spider http://$$(hostname):$${PORT:-7575} || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
