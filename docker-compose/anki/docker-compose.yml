services:
  anki:
    image: "${ANKI_IMAGE:-ghcr.io/luckyturtledev/anki}"
    container_name: anki-sync-server
    ports:
    - 8080:8080
    volumes:
    - "./data:/data"
    restart: unless-stopped
    user: '0:0'
    environment:
      SYNC_USER1: "${SYNC_USER1:?Set SYNC_USER1}"
      SYNC_PORT: '8080'
      SYNC_HOST: 0.0.0.0
      BASE_URL: "${BASE_URL:-https://anki.example.com}"
