services:
  dozzle:
    image: "${DOZZLE_IMAGE:-amir20/dozzle:v10.10.0}"
    ports:
    - 8080:8080
    volumes:
    - "./data:/data"
    - "/var/run/docker.sock:/var/run/docker.sock"
    restart: always
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      DOZZLE_HOSTNAME: "${DOZZLE_HOSTNAME:-rpimon}"
      DOZZLE_REMOTE_AGENT: "${DOZZLE_REMOTE_AGENT:-}"
      DOZZLE_NO_ANALYTICS: 'true'
      DOZZLE_AUTH_PROVIDER: simple
