services:
  app:
    image: "${APP_IMAGE:-jc21/nginx-proxy-manager:latest}"
    ports:
    - 80:80
    - 443:443
    - 81:81
    - 51820:51820/udp
    volumes:
    - "./data:/data"
    - "./nginx.conf:/etc/nginx/nginx.conf:ro"
    - "./letsencrypt:/etc/letsencrypt"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    environment:
      DISABLE_IPV6: 'true'
      X_FRAME_OPTIONS: "${X_FRAME_OPTIONS:-sameorigin}"
    healthcheck:
      test:
      - CMD
      - "/bin/check-health"
      interval: 10s
      timeout: 3s
