services:
  collector:
    build:
      context: .
      args:
        SCRUTINY_COLLECTOR_BASE: "${SCRUTINY_COLLECTOR_BASE:?Set SCRUTINY_COLLECTOR_BASE to the pinned upstream image}"
    image: "${SCRUTINY_COLLECTOR_IMAGE:-homelab/scrutiny-collector:v0.9.3}"
    container_name: scrutiny-collector
    command:
      - /bin/bash
      - -c
      - /opt/scrutiny/bin/collector-run.sh; exec /entrypoint-collector.sh
    environment:
      COLLECTOR_API_ENDPOINT: "${SCRUTINY_API_ENDPOINT:?Set the private Scrutiny API endpoint}"
      COLLECTOR_HOST_ID: "${SCRUTINY_HOST_ID:?Set the collector host label}"
      COLLECTOR_CRON_SCHEDULE: "${SCRUTINY_COLLECTOR_CRON_SCHEDULE:-15 3 * * *}"
      COLLECTOR_RUN_STARTUP: "false"
      KUMA_PUSH_HOST: "${SCRUTINY_KUMA_PUSH_HOST:?Set the private Kuma host}"
      KUMA_PUSH_PORT: "${SCRUTINY_KUMA_PUSH_PORT:-3001}"
      KUMA_PUSH_TOKEN: "${SCRUTINY_KUMA_PUSH_TOKEN:?Set the private Kuma push token}"
      TZ: "${TZ:?Set TZ}"
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    devices:
      - source: "${SCRUTINY_DEVICE_MEDIA2:?Set the stable media2 whole-disk path}"
        target: /dev/sda
        permissions: rwm
      - source: "${SCRUTINY_DEVICE_MEDIA3:?Set the stable media3 whole-disk path}"
        target: /dev/sdb
        permissions: rwm
      - source: "${SCRUTINY_DEVICE_SYSTEM:?Set the NVMe controller path}"
        target: /dev/nvme0
        permissions: rwm
    volumes:
      - /run/udev:/run/udev:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -f /run/scrutiny/last-success &&
          find /run/scrutiny/last-success -mmin -1560 -print -quit | grep -q .
      interval: 30m
      timeout: 10s
      retries: 2
      start_period: 5m
    init: true
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
        max-file: "${DOCKER_LOG_MAX_FILES:-3}"
    restart: unless-stopped
